name: Update player data

on:
  schedule:
    - cron: "0 9 * * *"    # 5 AM Eastern (daylight time)
    - cron: "0 10 * * *"   # 5 AM Eastern (standard time)
    - cron: "0 16 * * *"   # 12 PM Eastern (daylight time)
    - cron: "0 17 * * *"   # 12 PM Eastern (standard time)
    - cron: "0 19 * * *"   # 3 PM Eastern (daylight time)
    - cron: "0 20 * * *"   # 3 PM Eastern (standard time)
    - cron: "0 23 * * *"   # 7 PM Eastern (daylight time)
    - cron: "0 0 * * *"    # 7 PM Eastern (standard time)
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_players.py
      - run: python3 scripts/update_stats.py
      - run: python3 scripts/update_legacy.py
      - name: Save changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Update player and league history data" && git push)

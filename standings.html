<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Standings | Pac 12 Dynasty</title>
  <link rel="stylesheet" href="style.css">
  <style>
    th[data-type] { cursor: pointer; user-select: none; white-space: nowrap; }
    th[data-type]:hover { background: #13315c; }
    th[data-dir="asc"]::after { content: " ▲"; font-size: 0.75em; }
    th[data-dir="desc"]::after { content: " ▼"; font-size: 0.75em; }
    .status { color: #6b7785; font-size: 0.9rem; }
  </style>
</head>
<body>
  <header>
    <h1>League Standings</h1>
    <p>Updates automatically from Sleeper</p>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="teams.html">Teams</a>
    <a href="standings.html">Standings</a>
  </nav>
  <main>
    <div class="card">
      <h2 id="week-title">Standings</h2>
      <p>Click any column header to sort. Click again to reverse. <strong id="sort-label">Ranked by league standings.</strong></p>
      <p id="status" class="status">Loading standings from Sleeper...</p>
      <div class="table-wrap">
        <table class="sortable">
          <thead>
            <tr>
              <th data-type="num">Rank</th>
              <th data-type="text">Team</th>
              <th data-type="record">Record</th>
              <th data-type="num">P/F</th>
              <th data-type="num">P/A</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </div>
  </main>
  <footer>Pac 12 Dynasty Fantasy Football League</footer>

  <script>
    var LEAGUE_ID = "1315706586127171584";
    var API = "https://api.sleeper.app/v1";

    var table = document.querySelector("table.sortable");
    var body = table.tBodies[0];
    var headers = table.querySelectorAll("th[data-type]");
    var label = document.getElementById("sort-label");
    var statusEl = document.getElementById("status");

    // Turns a team name into its page filename, e.g. "Olave's Medical Team" -> "olaves-medical-team.html"
    function pageFor(name) {
      return name.toLowerCase()
        .replace(/['’]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "") + ".html";
    }

    function points(whole, decimal) {
      return (whole || 0) + (decimal || 0) / 100;
    }

    function getJSON(url) {
      return fetch(url).then(function (res) {
        if (!res.ok) throw new Error("Sleeper returned " + res.status);
        return res.json();
      });
    }

    Promise.all([
      getJSON(API + "/league/" + LEAGUE_ID + "/rosters"),
      getJSON(API + "/league/" + LEAGUE_ID + "/users"),
      getJSON(API + "/state/nfl").catch(function () { return null; })
    ]).then(function (results) {
      var rosters = results[0], users = results[1], state = results[2];

      var userById = {};
      users.forEach(function (u) { userById[u.user_id] = u; });

      var teams = rosters.map(function (r) {
        var u = userById[r.owner_id] || {};
        var name = (u.metadata && u.metadata.team_name) || u.display_name || ("Team " + r.roster_id);
        var s = r.settings || {};
        return {
          name: name,
          wins: s.wins || 0,
          losses: s.losses || 0,
          ties: s.ties || 0,
          pf: points(s.fpts, s.fpts_decimal),
          pa: points(s.fpts_against, s.fpts_against_decimal)
        };
      });

      // Official order: most wins, then most points for
      teams.sort(function (a, b) { return (b.wins - a.wins) || (b.pf - a.pf); });

      teams.forEach(function (t, i) {
        var record = t.wins + "-" + t.losses + (t.ties ? "-" + t.ties : "");
        var tr = document.createElement("tr");
        tr.innerHTML =
          "<td>" + (i + 1) + "</td>" +
          "<td><a></a></td>" +
          "<td>" + record + "</td>" +
          "<td>" + t.pf.toFixed(2) + "</td>" +
          "<td>" + t.pa.toFixed(2) + "</td>";
        var link = tr.cells[1].firstChild;
        link.href = pageFor(t.name);
        link.textContent = t.name;
        tr.dataset.rank = String(i + 1);
        body.appendChild(tr);
      });

      if (state && state.week) {
        document.getElementById("week-title").textContent = "Week " + state.week;
      }
      statusEl.textContent = "Live from Sleeper. Last loaded " + new Date().toLocaleString() + ".";
    }).catch(function (err) {
      statusEl.textContent = "Couldn't load standings from Sleeper right now. Try refreshing in a minute. (" + err.message + ")";
    });

    function value(row, col, type) {
      var text = row.cells[col].textContent.trim();
      if (col === 0) return parseFloat(row.dataset.rank);
      if (type === "num") return parseFloat(text);
      if (type === "record") {
        var parts = text.split("-").map(Number);
        var games = parts[0] + parts[1] + (parts[2] || 0);
        return games ? (parts[0] + (parts[2] || 0) / 2) / games : 0;
      }
      return text.toLowerCase();
    }

    function compare(a, b, col, type, dir) {
      var x = value(a, col, type), y = value(b, col, type);
      var result = x < y ? -1 : x > y ? 1 : 0;
      // Same record: break the tie with points for
      if (result === 0 && type === "record") {
        result = value(a, 3, "num") - value(b, 3, "num");
      }
      return dir === "asc" ? result : -result;
    }

    headers.forEach(function (th, col) {
      th.addEventListener("click", function () {
        var rows = Array.from(body.rows);
        if (!rows.length) return;
        var type = th.dataset.type;
        var bestDir = (type === "text" || col === 0) ? "asc" : "desc";
        var prev = th.dataset.dir;
        var dir = prev ? (prev === "asc" ? "desc" : "asc") : bestDir;

        headers.forEach(function (h) { delete h.dataset.dir; });
        th.dataset.dir = dir;

        if (col === 0 || type === "text") {
          rows.forEach(function (row) { row.cells[0].textContent = row.dataset.rank; });
          label.textContent = "Ranked by league standings.";
        } else {
          var best = rows.slice().sort(function (a, b) { return compare(a, b, col, type, bestDir); });
          best.forEach(function (row, i) {
            var rank = i + 1;
            if (i > 0 && compare(best[i - 1], row, col, type, bestDir) === 0) {
              rank = best[i - 1].cells[0].textContent;
            }
            row.cells[0].textContent = rank;
          });
          label.textContent = "Ranked by " + th.textContent.trim() + ".";
        }

        rows.sort(function (a, b) { return compare(a, b, col, type, dir); });
        rows.forEach(function (row) { body.appendChild(row); });
      });
    });
  </script>
</body>
</html>

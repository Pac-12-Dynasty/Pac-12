<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadmap | Pac 12 Dynasty</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; }
    html { background: #ECE6DC; }
    body { margin: 0; font-family: "Barlow", system-ui, sans-serif; font-size: 17px; background: #ECE6DC; color: #050505; line-height: 1.5; }
    h1, h2, h3 { font-family: "Big Shoulders Display", "Arial Narrow", sans-serif; font-weight: 800; line-height: 1.1; }
    main { max-width: 1160px; margin: 2rem auto; padding: 0 1rem; }
    footer { max-width: 1160px; margin: 1.5rem auto 0; padding: 1.5rem 1rem 2.5rem; border-top: 1px solid #d4cbbd; color: #5f574d; font-size: 0.9rem; }

    .legend { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-bottom: 1.5rem; font-size: 0.9rem; color: #5f574d; }
    .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

    .start { max-width: 320px; margin: 0 auto; }
    .tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-top: 1.25rem; }
    .track { background: none; border-top: 2px solid #050505; padding: 0.9rem 0 0; }
    .track h2 { margin: 0 0 0.25rem; font-size: 1.5rem; color: #050505; }
    .track .sub { margin: 0 0 1rem; font-size: 0.85rem; color: #5f574d; }

    .node { border-radius: 10px; padding: 0.75rem 0.9rem; border: 1px solid; }
    .node .top { display: flex; align-items: center; gap: 0.5rem; }
    .num { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; font-weight: 700; }
    .node h3 { margin: 0; font-family: "Barlow", system-ui, sans-serif; font-weight: 700; font-size: 1rem; }
    .node p { margin: 0.35rem 0 0; font-size: 0.85rem; }
    .needs { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .chip { font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: rgba(5,5,5,0.07); color: #050505; }

    .done { background: #E3DBCE; border-color: #d4cbbd; color: #3d3731; }
    .done .num { background: #050505; color: #ECE6DC; }
    .planned { background: rgba(230,91,196,0.1); border-color: #E65BC4; color: #050505; }
    .planned .num { background: #E65BC4; color: #050505; }
    .blank { background: none; border: 1.5px dashed #b9ae9c; color: #5f574d; }
    .blank .num { background: #E3DBCE; color: #5f574d; }

    .arrow { text-align: center; color: #b9ae9c; font-size: 1.1rem; line-height: 1; margin: 0.35rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Roadmap</h1>
    <p>What's coming to the Pac 12 Dynasty site</p>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="teams.html">Teams</a>
    <a href="standings.html">Standings</a>
  </nav>
  <main>
    <div class="legend">
      <span><i class="swatch" style="background:#050505"></i>Done</span>
      <span><i class="swatch" style="background:#E65BC4"></i>Planned</span>
      <span><i class="swatch" style="border:1.5px dashed #b9ae9c"></i>Open slot</span>
      <span>Numbers show priority order</span>
    </div>

    <div class="start" id="start"></div>
    <div class="arrow">&#8595;</div>
    <div class="tracks" id="tracks"></div>
  </main>
  <footer>Pac 12 Dynasty Fantasy Football League</footer>

  <script>
    // ===== Edit the roadmap here =====
    // status: "done", "planned", or "blank"
    // needs: numbers of items that have to be finished first
    var START = { title: "Site Live Today", note: "Standings, teams, and players from Sleeper", status: "done" };

    var TRACKS = [
      { name: "Accounts", sub: "Logins and owner features", items: [
        { num: 1, title: "Admin and User Accounts", note: "Logins, powered by Supabase", status: "done", needs: [] },
        { num: 2, title: "Trade Rumors and League News", note: "Rumors and news on the News page", status: "done", needs: [1] },
        { num: 6, title: "Notes on Team Pages", note: "Owners edit their own team", status: "planned", needs: [1] },
        { num: 3, title: "Trade Analyzer", note: "Grades trades, finds deals, reads the market", status: "done", needs: [1, 4] },
        { num: 16, title: "Team Value in Trade Grades", note: "Credit trades that make a team better overall", status: "done", needs: [3] },
        { num: 18, title: "Hindsight Trade Grades", note: "Past trades judged with today's values", status: "done", needs: [3] }
      ]},
      { name: "Sleeper Data", sub: "Pulled straight from the league", items: [
        { num: 4, title: "Draft Picks on Team Pages", note: "Owned and traded picks", status: "done", needs: [] },
        { num: 7, title: "Legacy Stats Page", note: "Win %, rivals, titles, top picks", status: "done", needs: [] },
        { num: 9, title: "Player Fantasy Rank", note: "Dynasty ranks on team pages", status: "done", needs: [] },
        { num: 15, title: "Trade History", note: "Every league trade with was and now ranks", status: "done", needs: [] },
        { num: 19, title: "Transactions Page", note: "Trades, waivers, and free agent moves", status: "done", needs: [15] }
      ]},
      { name: "Design", sub: "Look and feel", items: [
        { num: 5, title: "Site Redesign", note: "Cleaner, more visual layout", status: "done", needs: [] },
        { num: 8, title: "Landing Page Redesign", note: "Home page as the league hub", status: "done", needs: [5] },
        { num: 14, title: "Legacy Page Redesign", note: "Fresh look for league history", status: "planned", needs: [7] }
      ]},
      { name: "Player Details", sub: "Deeper info on every player", items: [
        { num: 10, title: "Game Logs", note: "Week by week stats from Sleeper", status: "done", needs: [] },
        { num: 11, title: "Injuries", note: "Badges colored by severity", status: "done", needs: [] },
        { num: 12, title: "Player History Stats", note: "Past seasons at a glance", status: "done", needs: [] },
        { num: 17, title: "Blended Player Values", note: "DynastyProcess, FantasyCalc, and league trades", status: "done", needs: [9] }
      ]},
      { name: "Later", sub: "Open slots for future ideas", items: [
        { num: 20, title: "Open Slot", note: "To be added", status: "blank", needs: [] },
        { num: 21, title: "Open Slot", note: "To be added", status: "blank", needs: [] },
        { num: 22, title: "Open Slot", note: "To be added", status: "blank", needs: [] }
      ]}
    ];
    // ===== End of roadmap =====

    function node(item) {
      var div = document.createElement("div");
      div.className = "node " + item.status;
      var top = document.createElement("div");
      top.className = "top";
      var num = document.createElement("span");
      num.className = "num";
      num.textContent = item.num != null ? item.num : "✓";
      var h3 = document.createElement("h3");
      h3.textContent = item.title;
      top.appendChild(num);
      top.appendChild(h3);
      div.appendChild(top);
      if (item.note) {
        var p = document.createElement("p");
        p.textContent = item.note;
        div.appendChild(p);
      }
      if (item.needs && item.needs.length) {
        var needs = document.createElement("div");
        needs.className = "needs";
        item.needs.forEach(function (n) {
          var chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = "Needs #" + n;
          needs.appendChild(chip);
        });
        div.appendChild(needs);
      }
      return div;
    }

    document.getElementById("start").appendChild(node(START));

    var tracksEl = document.getElementById("tracks");
    TRACKS.forEach(function (track) {
      var col = document.createElement("section");
      col.className = "track";
      var h2 = document.createElement("h2");
      h2.textContent = track.name;
      var sub = document.createElement("p");
      sub.className = "sub";
      sub.textContent = track.sub;
      col.appendChild(h2);
      col.appendChild(sub);
      track.items.forEach(function (item, i) {
        if (i > 0) {
          var arrow = document.createElement("div");
          arrow.className = "arrow";
          arrow.innerHTML = "&#8595;";
          col.appendChild(arrow);
        }
        col.appendChild(node(item));
      });
      tracksEl.appendChild(col);
    });
  </script>
  <script src="auth.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Roadmap | Pac 12 Dynasty</title>
  <link rel="stylesheet" href="style.css">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f5f7; color: #1f2933; line-height: 1.5; }
    header { background: #0b2545; color: #fff; text-align: center; padding: 2.5rem 1rem; }
    header h1 { margin: 0; font-size: 2.2rem; }
    header p { margin: 0.5rem 0 0; color: #c9d6e3; }
    nav { background: #13315c; display: flex; justify-content: center; flex-wrap: wrap; gap: 0.5rem; padding: 0.5rem; }
    nav a { color: #fff; text-decoration: none; font-weight: 600; padding: 0.5rem 1rem; border-radius: 6px; }
    nav a:hover { background: #eebf3a; color: #0b2545; }
    main { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; }
    footer { text-align: center; padding: 1.5rem; color: #6b7785; font-size: 0.9rem; }

    .legend { display: flex; flex-wrap: wrap; gap: 1rem; justify-content: center; margin-bottom: 1.5rem; font-size: 0.9rem; color: #52606d; }
    .legend span { display: inline-flex; align-items: center; gap: 0.4rem; }
    .swatch { width: 14px; height: 14px; border-radius: 3px; display: inline-block; }

    .start { max-width: 320px; margin: 0 auto; }
    .tracks { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 1.25rem; margin-top: 1.25rem; }
    .track { background: #fff; border-radius: 12px; padding: 1rem; box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
    .track h2 { margin: 0 0 0.25rem; font-size: 1rem; color: #0b2545; }
    .track .sub { margin: 0 0 1rem; font-size: 0.85rem; color: #6b7785; }

    .node { border-radius: 10px; padding: 0.75rem 0.9rem; border: 1px solid; }
    .node .top { display: flex; align-items: center; gap: 0.5rem; }
    .num { flex: 0 0 auto; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font-size: 0.8rem; font-weight: 700; }
    .node h3 { margin: 0; font-size: 0.98rem; }
    .node p { margin: 0.35rem 0 0; font-size: 0.85rem; }
    .needs { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.3rem; }
    .chip { font-size: 0.75rem; padding: 0.1rem 0.5rem; border-radius: 999px; background: rgba(11,37,69,0.08); color: #13315c; }

    .done { background: #eef0f3; border-color: #c5ccd6; color: #323f4b; }
    .done .num { background: #c5ccd6; color: #1f2933; }
    .planned { background: #e7f4f0; border-color: #6cc4a8; color: #0b4f3c; }
    .planned .num { background: #0f6e56; color: #fff; }
    .blank { background: #fff; border: 1.5px dashed #b0b8c4; color: #7b8794; }
    .blank .num { background: #e4e7eb; color: #7b8794; }

    .arrow { text-align: center; color: #9aa5b1; font-size: 1.1rem; line-height: 1; margin: 0.35rem 0; }
  </style>
</head>
<body>
  <header>
    <h1>Roadmap</h1>
    <p>What's coming to the Pac 12 Dynasty site</p>
  </header>
  <nav>
    <a href="index.html">Home</a>
    <a href="teams.html">Teams</a>
    <a href="standings.html">Standings</a>
  </nav>
  <main>
    <div class="legend">
      <span><i class="swatch" style="background:#c5ccd6"></i>Done</span>
      <span><i class="swatch" style="background:#0f6e56"></i>Planned</span>
      <span><i class="swatch" style="border:1.5px dashed #b0b8c4"></i>Open slot</span>
      <span>Numbers show priority order</span>
    </div>

    <div class="start" id="start"></div>
    <div class="arrow">&#8595;</div>
    <div class="tracks" id="tracks"></div>
  </main>
  <footer>Pac 12 Dynasty Fantasy Football League</footer>

  <script>
    // ===== Edit the roadmap here =====
    // status: "done", "planned", or "blank"
    // needs: numbers of items that have to be finished first
    var START = { title: "Site live today", note: "Standings, teams, and players from Sleeper", status: "done" };

    var TRACKS = [
      { name: "Accounts", sub: "Logins and owner features", items: [
        { num: 1, title: "Admin and user accounts", note: "Logins, powered by Supabase", status: "planned", needs: [] },
        { num: 2, title: "Trade rumors and league news", note: "Tabs owners can post to", status: "planned", needs: [1] },
        { num: 6, title: "Notes on team pages", note: "Owners edit their own team", status: "planned", needs: [1] },
        { num: 3, title: "AI trade value agent", note: "Learns from past trades and owners", status: "planned", needs: [1, 4] }
      ]},
      { name: "Sleeper data", sub: "Pulled straight from the league", items: [
        { num: 4, title: "Draft picks on team pages", note: "Owned and traded picks", status: "planned", needs: [] },
        { num: 7, title: "Legacy stats page", note: "Win %, rivals, titles, top picks", status: "planned", needs: [] },
        { num: 9, title: "Player fantasy rank", note: "Sleeper's rank on team pages", status: "done", needs: [] }
      ]},
      { name: "Design", sub: "Look and feel", items: [
        { num: 5, title: "Site redesign", note: "Cleaner, more visual layout", status: "planned", needs: [] },
        { num: 8, title: "Landing page redesign", note: "Home page as the league hub", status: "planned", needs: [5] }
      ]},
      { name: "Player details", sub: "Deeper info on every player", items: [
        { num: 10, title: "Game logs", note: "Week by week stats from Sleeper", status: "planned", needs: [] },
        { num: 11, title: "Injuries", note: "Current injury status", status: "done", needs: [] },
        { num: 12, title: "Player history stats", note: "Past seasons at a glance", status: "planned", needs: [] }
      ]},
      { name: "Later", sub: "Open slots for future ideas", items: [
        { num: 13, title: "Open slot", note: "To be added", status: "blank", needs: [] },
        { num: 14, title: "Open slot", note: "To be added", status: "blank", needs: [] },
        { num: 15, title: "Open slot", note: "To be added", status: "blank", needs: [] }
      ]}
    ];
    // ===== End of roadmap =====

    function node(item) {
      var div = document.createElement("div");
      div.className = "node " + item.status;
      var top = document.createElement("div");
      top.className = "top";
      var num = document.createElement("span");
      num.className = "num";
      num.textContent = item.num != null ? item.num : "✓";
      var h3 = document.createElement("h3");
      h3.textContent = item.title;
      top.appendChild(num);
      top.appendChild(h3);
      div.appendChild(top);
      if (item.note) {
        var p = document.createElement("p");
        p.textContent = item.note;
        div.appendChild(p);
      }
      if (item.needs && item.needs.length) {
        var needs = document.createElement("div");
        needs.className = "needs";
        item.needs.forEach(function (n) {
          var chip = document.createElement("span");
          chip.className = "chip";
          chip.textContent = "Needs #" + n;
          needs.appendChild(chip);
        });
        div.appendChild(needs);
      }
      return div;
    }

    document.getElementById("start").appendChild(node(START));

    var tracksEl = document.getElementById("tracks");
    TRACKS.forEach(function (track) {
      var col = document.createElement("section");
      col.className = "track";
      var h2 = document.createElement("h2");
      h2.textContent = track.name;
      var sub = document.createElement("p");
      sub.className = "sub";
      sub.textContent = track.sub;
      col.appendChild(h2);
      col.appendChild(sub);
      track.items.forEach(function (item, i) {
        if (i > 0) {
          var arrow = document.createElement("div");
          arrow.className = "arrow";
          arrow.innerHTML = "&#8595;";
          col.appendChild(arrow);
        }
        col.appendChild(node(item));
      });
      tracksEl.appendChild(col);
    });
  </script>
</body>
</html>
